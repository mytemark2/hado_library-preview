# Preview deploy triggers include synced app assets.
name: Deploy Hado Library Preview

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: "Optional app branch/ref. Leave blank to deploy the latest feature/app-x.y.z.w branch."
        required: false
        default: ""
  repository_dispatch:
    types:
      - sync_app_preview
      - app_branch_updated
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-preview.yml"
      - "index.html"
      - "HADO_DEV_INFO.json"
      - "RELEASE_MANIFEST.json"
      - "PREVIEW_SOURCE*.txt"
      - ".nojekyll"
      - "hadou_*.json"
      - "hado_*.js"
      - "hado_*.css"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview deployment config
        uses: actions/checkout@v4
        with:
          path: preview-repo

      - name: Verify single Pages deployment workflow
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pages_workflows < <(grep -rl --include='*.yml' --include='*.yaml' 'actions/deploy-pages@' preview-repo/.github/workflows | sort)
          printf 'Pages deployment workflows:\n%s\n' "${pages_workflows[*]:-none}"
          if [ "${#pages_workflows[@]}" -ne 1 ] || [ "${pages_workflows[0]}" != "preview-repo/.github/workflows/deploy-preview.yml" ]; then
            echo "Exactly one Pages deployment workflow is allowed: .github/workflows/deploy-preview.yml" >&2
            exit 1
          fi

      - name: Resolve preview source branch
        id: source
        shell: bash
        env:
          INPUT_APP_REF: ${{ github.event.inputs.app_ref || '' }}
          DISPATCH_APP_REF: ${{ github.event.client_payload.app_ref || '' }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_APP_REF}" ]; then
            APP_REF="${DISPATCH_APP_REF}"
          elif [ -n "${INPUT_APP_REF}" ]; then
            APP_REF="${INPUT_APP_REF}"
          elif [ -s preview-repo/PREVIEW_SOURCE_BRANCH.txt ]; then
            APP_REF="$(tr -d '\r\n' < preview-repo/PREVIEW_SOURCE_BRANCH.txt)"
          else
            APP_REF="$(
              git ls-remote --heads https://github.com/mytemark2/hado_library.git 'refs/heads/feature/app-*' \
                | awk '{print $2}' \
                | sed 's#refs/heads/##' \
                | grep -E '^feature/app-[0-9]+(\.[0-9]+){3}$' \
                | sort -V \
                | tail -n 1
            )"
          fi
          test -n "${APP_REF}"
          if ! [[ "${APP_REF}" =~ ^feature/app-[0-9]+(\.[0-9]+){3}$ ]]; then
            echo "Preview source branch is invalid: ${APP_REF}" >&2
            exit 1
          fi
          git ls-remote --exit-code --heads https://github.com/mytemark2/hado_library.git "refs/heads/${APP_REF}" >/dev/null
          echo "app_ref=${APP_REF}" >> "${GITHUB_OUTPUT}"
          echo "Resolved preview source: ${APP_REF}"

      - name: Checkout app development branch
        uses: actions/checkout@v4
        with:
          repository: mytemark2/hado_library
          ref: ${{ steps.source.outputs.app_ref }}
          path: app

      - name: Build preview artifact
        shell: bash
        env:
          APP_REF: ${{ steps.source.outputs.app_ref }}
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp app/index.html site/index.html
          find app -maxdepth 1 -type f -name 'hadou_*.json' -exec cp {} site/ \;
          find app -maxdepth 1 -type f -name 'hado_*.js' -exec cp {} site/ \;
          find app -maxdepth 1 -type f -name 'hado_*.css' -exec cp {} site/ \;
          if [ -f app/RELEASE_MANIFEST.json ]; then cp app/RELEASE_MANIFEST.json site/; fi

          DEV_LABEL="$(python - <<'PY'
          import re
          from pathlib import Path
          source = Path('app/hado_version.js').read_text(encoding='utf-8')
          release = re.search(r"releaseVersion:\s*'([^']+)'", source)
          update = re.search(r"updateNo:\s*'([^']*)'", source)
          revision = re.search(r"revision:\s*(\d+)", source)
          if not release or not update or not revision:
              raise SystemExit('releaseVersion/updateNo/revision not found in app/hado_version.js')
          base = f"{release.group(1)} Update{update.group(1)}" if update.group(1) else release.group(1)
          print(f"{base} r{revision.group(1)}")
          PY
          )"
          if [ -f app/HADO_DEV_INFO.json ]; then
            cp app/HADO_DEV_INFO.json site/HADO_DEV_INFO.json
          fi
          export DEV_LABEL

          SOURCE_COMMIT="$(git -C app rev-parse HEAD)"
          printf '%s\n' "${SOURCE_COMMIT}" > site/PREVIEW_SOURCE_COMMIT.txt
          printf '%s\n' "${APP_REF}" > site/PREVIEW_SOURCE_BRANCH.txt
          printf '%s\n' "${DEV_LABEL}" > site/PREVIEW_DISPLAY_VERSION.txt
          touch site/.nojekyll

          python - <<'PY'
          from pathlib import Path
          import html
          import os
          import re
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          label=os.environ['DEV_LABEL']
          safe=html.escape(label)
          style='''<style id="hado-preview-style">#hadoPreviewBanner{position:relative;z-index:1;background:#7c2d12;color:#fff;padding:6px 12px;font-weight:700;text-align:center;letter-spacing:.02em;box-shadow:0 1px 3px rgba(0,0,0,.16)}#hadoPreviewBanner[hidden]{display:none}</style>'''
          banner=f'''<div id="hadoPreviewBanner" role="status">Preview: {safe}</div><script id="hado-preview-banner-script">(()=>{{const banner=document.getElementById('hadoPreviewBanner');if(!banner)return;let observer=null;let frame=0;const hide=()=>{{banner.hidden=true;banner.setAttribute('aria-hidden','true');if(observer)observer.disconnect();if(frame)cancelAnimationFrame(frame)}};const loaded=()=>{{const status=document.getElementById('dataFileStatusText');return /(?:公開JSONを自動読込済|JSON読込済)/.test(status?.textContent||'')}};const watch=()=>{{const status=document.getElementById('dataFileStatusText');if(!status){{frame=requestAnimationFrame(watch);return}}if(loaded()){{hide();return}}observer=new MutationObserver(()=>{{if(loaded())hide()}});observer.observe(status,{{childList:true,characterData:true,subtree:true}})}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',watch,{{once:true}});else watch();setTimeout(hide,120000)}})();</script>'''
          if '</head>' in s and 'hado-preview-style' not in s:
              s=s.replace('</head>', style+'</head>', 1)
          if '<body' in s and '<div id="hadoPreviewBanner"' not in s:
              pos=s.find('>', s.find('<body'))+1
              s=s[:pos]+banner+s[pos:]
          if '<title>' in s:
              start=s.find('<title>')+7
              end=s.find('</title>', start)
              if end!=-1:
                  s=s[:start]+f'覇道ライブラリ {safe} [Preview]'+s[end:]
          p.write_text(s, encoding='utf-8')

          missing=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', s):
              src=src.split('?',1)[0].split('#',1)[0]
              if src.startswith(('http://','https://','//')):
                  continue
              rel=src[2:] if src.startswith('./') else src.lstrip('/')
              if rel and not Path('site', rel).is_file():
                  missing.append(rel)
          if missing:
              raise SystemExit('Missing local script assets: ' + ', '.join(sorted(set(missing))))
          PY

          printf '%s\n' "Preview source: mytemark2/hado_library@${APP_REF}" > site/PREVIEW_SOURCE.txt
          printf '%s\n' "Preview label: ${DEV_LABEL}" >> site/PREVIEW_SOURCE.txt
          printf '%s\n' "Generated at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> site/PREVIEW_SOURCE.txt
          test -f site/index.html
          test -f site/hado_styles.css
          test -s site/PREVIEW_SOURCE_COMMIT.txt
          test -s site/PREVIEW_SOURCE_BRANCH.txt
          test -s site/PREVIEW_DISPLAY_VERSION.txt
          test "$(cat site/PREVIEW_SOURCE_COMMIT.txt)" = "$(git -C app rev-parse HEAD)"
          test "$(cat site/PREVIEW_SOURCE_BRANCH.txt)" = "${APP_REF}"
          test "$(cat site/PREVIEW_DISPLAY_VERSION.txt)" = "${DEV_LABEL}"
          test "$(find site -maxdepth 1 -type f -name 'hadou_*.json' | wc -l)" -gt 0
          test "$(find site -maxdepth 1 -type f -name 'hado_*.js' | wc -l)" -gt 0
          grep -q '<div id="hadoPreviewBanner"' site/index.html
          grep -q 'id="hado-preview-banner-script"' site/index.html
          grep -q 'dataFileStatusText' site/index.html
          if grep -q '#hadoPreviewBanner{position:sticky' site/index.html; then
            echo "Preview banner must not cover the application header." >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
